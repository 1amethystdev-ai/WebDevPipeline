<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site pipeline panel</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#6a737d; --line:#d9dde3; --accent:#1f6feb; --ok:#1a7f37; --err:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1d2125; --ink:#e6e8eb; --mute:#98a1ab; --line:#33393f; --accent:#4c8dff; --ok:#3fb950; --err:#ff6b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  h2 { margin:0 0 10px; font-size:16px; }
  label { display:block; margin:10px 0 4px; color:var(--mute); font-size:13px; }
  input[type=text], input[type=password], textarea, select { width:100%; padding:9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
  textarea { min-height:160px; font:13px/1.45 ui-monospace,monospace; resize:vertical; }
  button { margin-top:12px; padding:10px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.backend { background:var(--ok); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:8px; } .row > * { flex:1; } .row button { flex:0 0 auto; margin-top:0; }
  .place { display:block; padding:8px; border:1px solid var(--line); border-radius:6px; margin-top:6px; cursor:pointer; color:var(--ink); }
  .place input { margin-right:8px; }
  .place small { color:var(--mute); display:block; margin-left:24px; }
  #log { white-space:pre-wrap; font:13px/1.5 ui-monospace,monospace; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hint { color:var(--mute); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <section>
    <h2>Admin password</h2>
    <input type="password" id="key" placeholder="ADMIN_PASSWORD from your Vercel settings">
  </section>

  <section>
    <h2>1. Find the business</h2>
    <div class="row">
      <input type="text" id="query" placeholder="e.g. Naina Home Decore Tangra Kolkata">
      <button id="findBtn">Search Maps</button>
    </div>
    <div id="places"></div>
  </section>

  <section>
    <h2>2. Frontend demo</h2>
    <label for="siteName">Website name (becomes the Vercel project name)</label>
    <input type="text" id="siteName" placeholder="naina-home-decore">
    <label for="frontPrompt">Frontend prompt (permanent version lives in lib/prompts.js)</label>
    <textarea id="frontPrompt"></textarea>
    <button id="frontBtn" disabled>Generate and deploy frontend</button>
  </section>

  <section>
    <h2>3. Backend (after client approval)</h2>
    <label for="jobSelect">Site</label>
    <select id="jobSelect"></select>
    <div class="hint">Saved sites are stored in this browser only. Use the same browser for step 3.</div>
    <label for="notes">Client requirements for the backend (optional)</label>
    <textarea id="notes" style="min-height:70px" placeholder="e.g. contact form emails to ..., booking calendar, admin login"></textarea>
    <label for="backPrompt">Backend prompt (permanent version lives in lib/prompts.js)</label>
    <textarea id="backPrompt"></textarea>
    <label style="color:var(--ink)"><input type="checkbox" id="approved"> Client has approved the frontend and paid</label>
    <button id="backBtn" class="backend" disabled>Generate and deploy backend</button>
  </section>

  <section>
    <h2>Output</h2>
    <div id="log">Nothing yet.</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let places = [], selected = null;
const getJobs = () => JSON.parse(localStorage.getItem("jobs") || "{}");
const setJobs = (j) => localStorage.setItem("jobs", JSON.stringify(j));

$("key").value = sessionStorage.getItem("key") || "";
$("key").addEventListener("change", () => { sessionStorage.setItem("key", $("key").value); loadPrompts(); });

function log(msg, cls = "") { $("log").innerHTML = `<span class="${cls}">${msg}</span>`; }

async function api(path, body) {
  const r = await fetch("/api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "x-admin-key": $("key").value },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

async function loadPrompts() {
  if (!$("key").value) return;
  try {
    const p = await api("prompts");
    $("frontPrompt").value = p.frontend;
    $("backPrompt").value = p.backend;
  } catch (e) { log(e.message, "err"); }
}

function loadJobs() {
  const jobs = getJobs();
  $("jobSelect").innerHTML = Object.values(jobs).map((j) => `<option value="${j.name}">${j.name}${j.backendUrl ? " (backend done)" : ""}</option>`).join("") || "<option value=''>No sites yet</option>";
  syncBackBtn();
}

function syncBackBtn() { $("backBtn").disabled = !($("approved").checked && $("jobSelect").value); }
$("approved").addEventListener("change", syncBackBtn);
$("jobSelect").addEventListener("change", syncBackBtn);

$("findBtn").onclick = async () => {
  try {
    log("Searching...");
    places = (await api("find", { query: $("query").value })).places;
    if (!places.length) return log("No results.", "err");
    $("places").innerHTML = places.map((p, i) => `<label class="place"><input type="radio" name="place" value="${p.id}" ${i === 0 ? "checked" : ""}>${p.name}<small>${p.address || ""} ${p.rating ? "· " + p.rating + "★" : ""}</small></label>`).join("");
    const pick = () => { const id = document.querySelector("input[name=place]:checked").value; selected = places.find((p) => p.id === id); $("frontBtn").disabled = false; };
    $("places").onchange = pick; pick();
    if (!$("siteName").value) $("siteName").value = places[0].name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    log("Pick the right business, then continue to step 2.");
  } catch (e) { log(e.message, "err"); }
};

$("frontBtn").onclick = async () => {
  $("frontBtn").disabled = true;
  try {
    log("Pulling Maps data, generating the site, deploying. This takes 1-3 minutes...");
    const d = await api("frontend", { place: selected.raw, siteName: $("siteName").value, prompt: $("frontPrompt").value });
    const jobs = getJobs();
    jobs[d.name] = { name: d.name, business: d.business, imageUrls: d.imageUrls, files: d.files, frontendUrl: d.url };
    setJobs(jobs);
    log(`Frontend live: <a href="${d.url}" target="_blank">${d.url}</a>\nFiles: ${Object.keys(d.files).join(", ")}`, "ok");
    loadJobs();
  } catch (e) { log(e.message, "err"); }
  $("frontBtn").disabled = false;
};

$("backBtn").onclick = async () => {
  $("backBtn").disabled = true;
  try {
    log("Generating the backend and redeploying. This takes 1-3 minutes...");
    const jobs = getJobs();
    const job = jobs[$("jobSelect").value];
    const d = await api("backend", { job, prompt: $("backPrompt").value, notes: $("notes").value });
    job.files = d.files; job.backendUrl = d.url;
    setJobs(jobs);
    log(`Backend deployed: <a href="${d.url}" target="_blank">${d.url}</a>\nFiles changed or added: ${d.changed.join(", ")}`, "ok");
    loadJobs();
  } catch (e) { log(e.message, "err"); }
  syncBackBtn();
};

loadPrompts(); loadJobs();
</script>
</body>
</html>
